name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y genisoimage shellcheck libcairo2 libsdl2-2.0-0 libgdk-pixbuf-2.0-0 libgtk-3-0 fonts-dejavu-core
      - run: pip install pytest
      - run: pytest -q
      - run: shellcheck bin/vistal install.sh
